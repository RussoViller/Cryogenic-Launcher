name: Debug APKs

# Gera os APKs debug (arm64-v8a, armeabi-v7a e as versões IS) sempre que o código-fonte é atualizado.
# Os APKs ficam em Actions > (execução) > Artifacts.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.cmod'
      - 'cmod-sdk/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'sponsors/**'
      - '.github/workflows/sponsors.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Debug ${{ matrix.arch }}${{ matrix.storage == 'is' && ' IS' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm]
        storage: ['', is]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: on-failure

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.2.9519653" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Use the CI debug key
        # chave só para debug (pública, não é a chave oficial): mantém a mesma assinatura entre builds,
        # então um APK debug novo atualiza o anterior sem precisar desinstalar
        run: |
          mkdir -p "$HOME/.android"
          cp .github/ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :CryogenicLauncher:assembleDebug -Darch=${{ matrix.arch }} ${{ matrix.storage == 'is' && '-Dstorage=is' || '' }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryogenicLauncher-debug-${{ matrix.arch == 'arm64' && 'arm64-v8a' || 'armeabi-v7a' }}${{ matrix.storage == 'is' && '-IS' || '' }}
          path: CryogenicLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
